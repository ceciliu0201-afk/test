<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 6: The Forest Scan</title>
    <style>
        :root {
            --glitch-green: #00ff41;
            --error-red: #ff3131;
            --scan-speed: 3s;
        }

        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Glitch Scanline Effect */
        .scanner {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 4px;
            background: var(--glitch-green);
            box-shadow: 0 0 20px var(--glitch-green);
            z-index: 100;
            opacity: 0.6;
            animation: scan var(--scan-speed) linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }

        /* Activity Container */
        .scene {
            position: relative;
            width: 100%;
            height: 80vh;
            border: 1px solid #333;
            margin-top: 20px;
        }

        .instruction {
            padding: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Interactive Items */
        .item {
            position: absolute;
            padding: 15px;
            border: 1px transparent solid;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            user-select: none;
        }

        .item:hover {
            border: 1px solid var(--glitch-green);
            color: var(--glitch-green);
            text-shadow: 0 0 8px var(--glitch-green);
        }

        /* Feedback Display */
        #status-display {
            position: fixed;
            bottom: 10%;
            font-size: 1.5rem;
            font-weight: bold;
            height: 2rem;
            text-transform: uppercase;
        }

        .success { color: var(--glitch-green); animation: flicker 0.1s infinite; }
        .failure { color: var(--error-red); animation: shake 0.2s infinite; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        @keyframes flicker {
            0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="scanner"></div>

<div class="instruction">
    [ SYSTEM SCAN: Identify organic components ]
</div>

<div class="scene" id="game-scene">
    <div class="item" style="top:20%; left:25%;" data-valid="true">>> BIRDS</div>
    <div class="item" style="top:40%; left:60%;" data-valid="true">>> TREES</div>
    <div class="item" style="top:70%; left:15%;" data-valid="false">>> TOYS</div>
    <div class="item" style="top:60%; left:75%;" data-valid="false">>> BENCHES</div>
</div>

<div id="status-display">READY TO SCAN...</div>

<script>
    const statusDisplay = document.getElementById('status-display');
    const items = document.querySelectorAll('.item');

    items.forEach(item => {
        item.addEventListener('click', () => {
            const isValid = item.getAttribute('data-valid') === 'true';

            if (isValid) {
                statusDisplay.innerText = "DATA SYNCED: ORGANIC DETECTED";
                statusDisplay.className = "success";
                item.style.color = "var(--glitch-green)";
            } else {
                statusDisplay.innerText = "CRITICAL ERROR: SYSTEM GLITCH";
                statusDisplay.className = "failure";
                // Screen shake effect
                document.body.style.animation = "shake 0.1s 3";
                setTimeout(() => document.body.style.animation = "", 300);
            }

            // Auto-clear status
            setTimeout(() => {
                statusDisplay.innerText = "SCANNING...";
                statusDisplay.className = "";
            }, 2000);
        });
    });
</script>

</body>
</html>
